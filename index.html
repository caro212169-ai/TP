<title>Lexique pâtisserie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : appli mobile type « parcours » ; barre de stats en haut, navigation en bas, leçons plein écran */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5; --sunk:#F7F7F7;
  --green:#58CC02; --green-d:#46A302; --green-soft:#D7FFB8; --green-ink:#58A700;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-soft:#DDF4FF; --blue-ink:#1899D6;
  --red:#FF4B4B; --red-d:#EA2B2B; --red-soft:#FFDFE0; --red-ink:#EA2B2B;
  --orange:#FF9600; --orange-d:#E08600; --orange-soft:#FFF0D9;
  --purple:#CE82FF; --purple-d:#A568CC; --purple-soft:#F4E5FF;
  --pink:#FF86D0; --pink-d:#E070B5; --yellow:#FFC800; --yellow-d:#E5A900; --yellow-soft:#FFF5D1;
  --font:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131F24;--surface:#131F24;--ink:#F1F7FB;--muted:#93A8B3;--line:#37464F;--sunk:#1B2B32;
  --green-soft:#1F3A12;--green-ink:#79D634;--blue-soft:#12324A;--blue-ink:#49C0F8;--red-soft:#3D1E22;--red-ink:#FF7878;
  --orange-soft:#3B2A12;--purple-soft:#2F2140;--yellow-soft:#3A3212;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131F24;--surface:#131F24;--ink:#F1F7FB;--muted:#93A8B3;--line:#37464F;--sunk:#1B2B32;
  --green-soft:#1F3A12;--green-ink:#79D634;--blue-soft:#12324A;--blue-ink:#49C0F8;--red-soft:#3D1E22;--red-ink:#FF7878;
  --orange-soft:#3B2A12;--purple-soft:#2F2140;--yellow-soft:#3A3212;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;font-weight:600}
button{font-family:var(--font)}
h1,h2,h3{margin:0;font-weight:900;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.wrap{max-width:600px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barre du haut */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;background:none;border:0;color:inherit;cursor:pointer;padding:4px}
.stat svg{width:26px;height:26px}
.s-fire{color:var(--orange)} .s-fire.off{color:var(--muted)} .s-gem{color:var(--blue)} .s-star{color:var(--green)} .s-xp{color:var(--yellow-d)}

/* Navigation du bas */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bottom .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 0}
.bottom button{background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:800;font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.bottom button svg{width:28px;height:28px}
.bottom button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}

/* Boutons 3D */
.b3{--c:var(--green);--cd:var(--green-d);background:var(--c);color:#fff;border:0;border-bottom:4px solid var(--cd);border-radius:16px;font-weight:900;font-size:1rem;text-transform:uppercase;letter-spacing:.05em;padding:13px 18px;cursor:pointer;width:100%;transition:transform .05s}
.b3:active{transform:translateY(2px);border-bottom-width:2px}
.b3[disabled]{--c:var(--line);--cd:var(--line);color:var(--muted);cursor:default}
.b3.blue{--c:var(--blue);--cd:var(--blue-d)} .b3.red{--c:var(--red);--cd:var(--red-d)} .b3.orange{--c:var(--orange);--cd:var(--orange-d)} .b3.purple{--c:var(--purple);--cd:var(--purple-d)}
.b3.ghost{background:var(--surface);color:var(--blue-ink);border:2px solid var(--line);border-bottom-width:4px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Parcours */
.unit{border-radius:16px;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px;border-bottom:4px solid rgba(0,0,0,.18)}
.unit small{display:block;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem}
.unit h2{font-size:1.2rem}
.unit .mini{width:52px;height:52px;flex:0 0 auto}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 4px;position:relative}
.node{position:relative;width:72px;height:66px;border-radius:50%;border:0;cursor:pointer;background:var(--c,var(--line));box-shadow:0 7px 0 var(--cd,#C8C8C8);display:grid;place-items:center;color:#fff;transition:transform .08s}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cd)}
.node.locked{--c:var(--line);--cd:#CFCFCF;color:#AFAFAF;cursor:pointer}
:root[data-theme="dark"] .node.locked{--cd:#2A363C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .node.locked{--cd:#2A363C}}
.node.gold{--c:var(--yellow);--cd:var(--yellow-d)}
.node.trophy{width:84px;height:76px}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap svg.ring{position:absolute;width:98px;height:98px;top:50%;left:50%;transform:translate(-50%,-46%) rotate(-90deg)}
.bubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c2,var(--green-ink));font-weight:900;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;padding:8px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.side-m{position:absolute;width:96px}

/* Cartes et listes */
.panel{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.panel h2{font-size:1.2rem}
.tile{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px;background:var(--surface);cursor:pointer;color:inherit;text-align:left;width:100%}
.tile .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:32px;height:32px}
.tile b{display:block;font-size:1.05rem;font-weight:900}
.tile span{color:var(--muted);font-size:.88rem}
.tiles{display:flex;flex-direction:column;gap:10px}
.qbar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.qbar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.qbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:900;color:var(--ink)}
.quest{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px;align-items:center;padding:6px 0}
.quest b{display:block;margin-bottom:6px}
.chest{width:44px;height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:800;font-size:.85rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:5px 11px;cursor:pointer;min-width:38px}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.big{font-size:3rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;border:2px solid var(--line)}
.rung.on{background:var(--green-soft);border-color:var(--green)} .rung.cur{background:var(--yellow-soft);border-color:var(--yellow)}
.rung i{font-style:normal;font-weight:900;text-align:center}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}

function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GRX=new RegExp("(^|[^a-zà-ÿ-])("+GKEYS.map(k=>k.replace(/[-]/g,"\\-")).join("|")+")(?=$|[^a-zà-ÿ-])","gi");
// définition avec les mots difficiles soulignés ; on n'explique jamais un mot qui donnerait la réponse
function rich(d,w){
  const stem=w?norm(w.m).slice(0,5):"~";
  return esc(d).replace(GRX,(all,pre,t)=>{const k=t.toLowerCase();
    if(!GLOSS[k]||norm(k).startsWith(stem))return all;
    return `${pre}<button type="button" class="gl" data-gl="${esc(k)}">${t}</button>`});
}
function clair(w){return EXPL[w.m]?`<div class="clair"><b>En clair</b><span>${esc(EXPL[w.m])}</span></div>`:""}
document.addEventListener("click",e=>{
  const b=e.target.closest(".gl");if(!b)return;e.stopPropagation();
  const host=b.closest(".def,dd,.hint")||b.parentElement;
  let box=host.nextElementSibling&&host.nextElementSibling.classList.contains("glbox")?host.nextElementSibling:null;
  if(!box){box=document.createElement("p");box.className="glbox";host.after(box)}
  if(box.dataset.k===b.dataset.gl){box.remove();return}
  box.dataset.k=b.dataset.gl;box.innerHTML=`<b>${esc(b.textContent)}</b> : ${esc(GLOSS[b.dataset.gl])}`;
},true);


/* ---------- Outils ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function dayNum(d=new Date()){return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)}
const TODAY=()=>dayNum();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

  const qs=todaysQuests();let all=true;
  qs.forEach(x=>{const key=TODAY()+x.id;const val=q[x.k]||0;

function sfx(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const seq={ok:[[660,.0],[880,.09]],ko:[[220,0],[180,.12]],done:[[523,0],[659,.1],[784,.2],[1047,.32]],quest:[[784,0],[988,.08],[1175,.16]],level:[[523,0],[784,.12],[1047,.24],[1319,.36]],tap:[[500,0]]}[kind]||[];
  seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==="ko"?"sawtooth":"triangle";o.frequency.value=f;
    const s=AC.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(kind==="ko"?.06:.13,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+(kind==="tap"?.06:.22));
    o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.25)})}catch(e){}}
let FRV=null;function frVoice(){try{if(!FRV){const v=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));FRV=v.find(x=>/fr-FR/i.test(x.lang)&&/Amélie|Thomas|Audrey|Google/i.test(x.name))||v.find(x=>/fr-FR/i.test(x.lang))||v[0]||null}}catch(e){}return FRV}

/* ---------- Toasts et confettis ---------- */
let toastQ=[],toastBusy=false;
function toast(t,s,c,ic,conf){toastQ.push([t,s,c,ic,conf]);if(!toastBusy)nextToast()}
function nextToast(){const x=toastQ.shift();if(!x){toastBusy=false;return}toastBusy=true;
  const el=document.getElementById("toast");el.innerHTML=`<span class="ti" style="background:${x[2]}">${x[3]}</span><span><b>${esc(x[0])}</b><span>${esc(x[1])}</span></span>`;
  el.classList.add("show");if(x[4])confetti();setTimeout(()=>{el.classList.remove("show");setTimeout(nextToast,380)},2600)}
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#58CC02","#1CB0F6","#FF9600","#FF4B4B","#CE82FF","#FFC800"];
  const P=Array.from({length:140},()=>({x:c.width/2+(Math.random()-.5)*120,y:c.height*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*7+5,r:Math.random()*6,c:pick(cols)}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<120)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

/* ---------- Réponse (répétition espacée) ---------- */
let combo=0;
function answer(w,q){
  const c=card(w),t=TODAY(),wasDue=c.due<=t||c.b===0,pg=gradeOf(masteredCount()),wasM=c.b>=4;
  c.n++;S.days[t]=(S.days[t]||0)+1;const goalBefore=(S.days[t]-1)>=GOAL;
  let xp=0;
  if(q===2){c.ok++;combo++;S.best.combo=Math.max(S.best.combo,combo);
    if(wasDue){const was5=c.b===5;c.b=Math.min(5,c.b+1);c.due=t+(was5?21:INT[c.b])}xp=10+Math.min(combo,10);bump("ok");bump("combo",combo,true)}
  else if(q===1){combo=0;c.b=Math.max(1,Math.min(c.b,3));c.due=t+(c.b>=2?1:0);xp=5}
  else{combo=0;c.b=c.b>=4?2:1;c.due=t;xp=2}
  if(boost())xp*=2;
  S.bestStreak=Math.max(S.bestStreak||0,streak());
  S.xp+=xp;bump("xp",xp);
  if(!wasM&&c.b>=4)toast("Mot maîtrisé !",`${w.m} · ${masteredCount()} / ${N}`,"var(--green)",IC.star,false);
  if(wasM&&c.b<4)toast("À consolider : "+w.m,"Il revient dans tes révisions, pas de panique.","var(--orange)",IC.bolt,false);
  if(!goalBefore&&S.days[t]>=GOAL)toast("Objectif du jour atteint !","Tu peux viser le super objectif : 60 réponses !","var(--green)",IC.target,true);
  if(S.days[t]===GOAL2){S.gems+=15;toast("Super objectif atteint !","60 réponses aujourd'hui · +15 gemmes","var(--purple)",IC.crown,true)}
  S.mh=S.mh||{};S.mh[t]=masteredCount();
  checkRewards(pg);save();return xp;
}

const OFF=[0,48,72,48,0,-48,-72,-48];
function nudge(){
  const t=TODAY(),today=S.days[t]||0,due=W.filter(w=>seen(w)&&card(w).due<=t).length,st=streak(),k=masteredCount(),g=gradeOf(k),next=GRADES[g+1];
  if(!today)return st?`Ta série est de <b>${st} jour${st>1?"s":""}</b>. Fais une leçon aujourd'hui pour ne pas la perdre !`:"Prêt pour ta première leçon du jour ? 5 minutes suffisent !";
  if(due)return `<b>${due} mot${due>1?"s":""}</b> t'attendent pour leur révision. C'est ce qui les fait rester dans ta tête !`;
  if(today<GOAL)return `Encore <b>${GOAL-today} réponses</b> pour remplir ton objectif du jour. Allez, une leçon de plus !`;
  if(today<GOAL2)return `Objectif rempli, bravo ! Encore <b>${GOAL2-today}</b> pour le super objectif et 15 gemmes.`;
  if(next)return `Quelle journée ! Plus que <b>${next.at-k} mot${next.at-k>1?"s":""}</b> à maîtriser pour devenir ${esc(next.n)}.`;
  return "Tu es au sommet ! Garde ta série chaque jour pour tout retenir.";
}

/* ---------- Construction d'une leçon ---------- */
function reviewWords(exclude,n){
  const t=TODAY();const pool=W.filter(w=>seen(w)&&!exclude.includes(w));
  const due=shuffle(pool.filter(w=>card(w).due<=t)).sort((a,b)=>B(a)-B(b));
  const rest=shuffle(pool.filter(w=>card(w).due>t));
  return [...due,...rest].slice(0,n);
}
function lessonSteps(node){
  const ws=node.words,steps=[];
  if(node.type==="lesson"){
    // Chaque nouveau mot : présentation, puis UNE question un peu plus tard (pas juste après)
    const news=shuffle(ws.filter(w=>!seen(w))),olds=shuffle(ws.filter(seen));
    news.forEach((w,i)=>{steps.push({t:"intro",w});if(i>=1)steps.push({t:"auto",w:news[i-1]})});
    const tail=[];
    if(news.length)tail.push({t:"auto",w:news[news.length-1]});
    olds.forEach(w=>tail.push({t:"auto",w}));
    reviewWords(ws,3).forEach(w=>tail.push({t:"auto",w,rev:true}));
    steps.push(...shuffle(tail));
    if(ws.length>=3)steps.push({t:"pairs",ws:shuffle(ws).slice(0,5)});
  }else{
    const pool=shuffle(ws).sort((a,b)=>B(a)-B(b));const sel=pool.slice(0,node.n||12);
    sel.forEach(w=>steps.push({t:seen(w)?"auto":"intro",w}));
    steps.splice(4,0,{t:"pairs",ws:shuffle(sel).slice(0,5)});
  }
  return steps;
}
function typeFor(step,run){
  if(step.t!=="auto")return step.t;
  const w=step.w,b=B(w),hits=run.hits[w.m]||0;
  if(b<=1)return hits?pick(["qcm","flash"]):pick(["qcm","qcmInv"]);
  if(b===2)return pick(["qcm","qcmInv","flash","defWrite"]);
  if(b===3)return pick(["write","defWrite","flash","qcm"]);
  return pick(["write","defWrite","defWrite","flash"]);
}

function kn(s){return String(s).toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function stemOf(w){const b=kn(w).replace(/s$/,"");if(b.includes(" "))return b;return b.length>5?b.slice(0,Math.max(5,b.length-2)):b}
function kwHit(alt,text,toks){const st=stemOf(alt);if(!st)return false;if(st.includes(" "))return (" "+text+" ").includes(" "+st);
  return toks.some(t=>t.startsWith(st)||(st.length>=5&&t.length>=st.length&&lev(t.slice(0,st.length),st)<=1))}
function kwCheck(w,answer){const text=kn(answer),toks=text.split(" ").filter(Boolean);
  return (KW[w.m]||[]).map(k=>{const alts=k.split("/");return{label:alts[0],ok:alts.some(a=>kwHit(a,text,toks))}})}
function kwChips(w,cls="key"){const k=KW[w.m]||[];return k.length?`<div class="kws"><span class="small muted" style="font-weight:800">Mots-clés :</span>${k.map(x=>`<span class="kw ${cls}">${esc(x.split("/")[0])}</span>`).join("")}</div>`:""}

/* ---------- Examen blanc ---------- */
function startExam(full){
  const seenW=W.filter(seen);
  const pool=full?W:seenW;
  if(!full&&seenW.length<8){toast("Pas encore assez de mots","Fais quelques leçons, ou choisis l'examen complet.","var(--blue)",IC.star);return}
  const sel=shuffle(pool).slice(0,20),h=Math.ceil(sel.length/2);
  const steps=shuffle(sel.map((w,i)=>({t:i<h?"defWrite":"write",w})));
  startRun(steps,{exam:true,full,results:[]});
}
function examRecord(s,q,pts,info){
  answer(s.w,q);run.results.push({w:s.w,pts,...info});run.n++;if(pts>=1)run.ok++;
  run.i++;nextStep();
}
function examEnd(r){
  const n=r.results.length||1,tot=r.results.reduce((a,x)=>a+x.pts,0);
  const note=Math.round(tot/n*20*2)/2;
  S.exams=S.exams||[];S.exams.push({d:TODAY(),s:note,full:!!r.full});save();checkRewards(gradeOf(masteredCount()));
  const secs=Math.round((Date.now()-r.t0)/1000);
  const msg=note>=16?"Prêt pour le jour J !":note>=12?"Bien ! Encore quelques mots à consolider.":note>=8?"Ça progresse, continue tes révisions.":"Pas de panique, c'est un entraînement : les mots ratés vont revenir.";
  sfx(note>=12?"done":"tap");if(note>=14)confetti();
  setTimeout(()=>say(`${String(note).replace(".",",")} sur 20. ${msg}`),500);
  const best=Math.max(...S.exams.map(e=>e.s));
  const rows=r.results.map(x=>{const ok=x.pts>=1,part=x.pts>0&&x.pts<1;
    const pts=String(x.pts).replace(".",",");
    return `<div class="exrow ${ok?"ok":part?"mid":"ko"}"><div class="exh"><b>${esc(x.w.m)}</b><span class="pill ${ok?"p4":part?"p2":"p1"}">${pts} pt</span></div>
     ${x.type==="def"?`<div class="kws">${x.res.map(k=>`<span class="kw ${k.ok?"on":"off"}">${k.ok?"✓":"✗"} ${esc(k.label)}</span>`).join("")}</div>`:`<p class="small">${x.txt?`Ta réponse : <b>${esc(x.txt)}</b>`:"Pas de réponse"}${ok?"":` · bonne réponse : <b>${esc(x.w.m)}</b>`}</p>`}
     ${ok?"":`<p class="small muted">${esc(x.w.d)}</p>`}</div>`}).join("");
  app.innerHTML=`<section class="endscreen">${mascot(note>=12?"wow":"happy",120)}<h1>${String(note).replace(".",",")} / 20</h1><p>${msg}</p>
   <div class="kpis"><div class="kpi" style="--c:var(--green)"><small>Réussis</small><b>${r.results.filter(x=>x.pts>=1).length}/${n}</b></div><div class="kpi" style="--c:var(--purple)"><small>Meilleure note</small><b>${String(best).replace(".",",")}</b></div><div class="kpi" style="--c:var(--blue)"><small>Temps</small><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b></div></div>
   <div style="width:100%;text-align:left;display:flex;flex-direction:column;gap:8px"><h2>Correction</h2>${rows}</div>
   <button class="b3" id="go">Terminer</button></section>`;
  document.getElementById("go").onclick=()=>{window._scrolled=0;render()};
}

/* ---------- Bilan pour maman ---------- */
function weekStats(){
  const t=TODAY(),days=[];for(let d=t-6;d<=t;d++)days.push({d,n:S.days[d]||0});
  const played=days.filter(x=>x.n>0).length,answers=days.reduce((a,x)=>a+x.n,0);
  const mh=S.mh||{};const before=Object.keys(mh).map(Number).filter(d=>d<t-6).sort((a,b)=>b-a)[0];
  const gained=masteredCount()-(before!==undefined?mh[before]:0);
  const hard=W.filter(seen).map(w=>({w,e:card(w).n-card(w).ok})).filter(x=>x.e>0).sort((a,b)=>b.e-a.e||B(a.w)-B(b.w)).slice(0,6).map(x=>x.w);
  const ex=(S.exams||[]).slice(-1)[0],best=(S.exams||[]).length?Math.max(...S.exams.map(e=>e.s)):null;
  return{days,played,answers,gained,hard,ex,best};
}

Jours joués : ${s.played}/7 · Série : ${streak()} j · Total : ${totalDays()} jours

/* ---------- Moteur de leçon ---------- */
let run=null,timers=[];
function stopTimers(){timers.forEach(clearInterval);timers=[]}
function startNode(node){startRun(lessonSteps(node),{node,title:node.type==="review"?"Révision":"Leçon"})}
function startRun(steps,opt={}){
  combo=0;run={steps,i:0,total:steps.length,mist:0,ok:0,n:0,xp:0,t0:Date.now(),hits:{},...opt};
  nav.hidden=true;window.scrollTo(0,0);nextStep();
}
function lhead(){const p=run.i/run.total;
  return `<div class="lhead"><button class="x" id="quit" aria-label="Quitter">${IC.x}</button><div class="lbar"><i style="width:${p*100}%"></i></div>${combo>=3?`<span class="combo">${IC.fire.replace('<svg','<svg width="18" height="18" style="vertical-align:-3px"')} ${combo}</span>`:""}</div>`}
function bindQuit(){document.getElementById("quit").onclick=()=>{stopTimers();hideSheet();run=null;render()}}
function nextStep(){
  hideSheet();closeKeyboard();
  if(run.i>=run.steps.length)return finishRun();
  const s=run.steps[run.i];const t=typeFor(s,run);
  ({intro:sIntro,qcm:sQcm,qcmInv:sQcmInv,write:sWrite,pairs:sPairs,flash:sFlash,defWrite:sDefWrite})[t](s);
  window.scrollTo(0,0);
}
function advance(){run.i++;nextStep()}
function requeue(s){const back={...s,t:s.t==="intro"?"qcm":s.t};run.steps.push(back);run.total=run.steps.length}
function record(s,q){
  const gain=answer(s.w,q);run.xp+=gain;run.n++;
  if(q===2){run.ok++;run.hits[s.w.m]=(run.hits[s.w.m]||0)+1}else{run.mist++;run.req=run.req||{};if(!run.req[s.w.m]){run.req[s.w.m]=1;requeue(s)}}
  return gain;
}

function distractors(w,n=3){
  const fam=(famOf[w.m]||[]).flatMap(fi=>FAMS[fi].w).filter(m=>m!==w.m&&byM[m]);
  const others=shuffle(W.filter(x=>x.m!==w.m&&!fam.includes(x.m))).map(x=>x.m);
  return shuffle([...new Set([...shuffle(fam).slice(0,2),...others])]).slice(0,n);
}
function choose(s,opts,correct,prompt,one){
  let sel=null;
  app.innerHTML=`<section class="lesson">${lhead()}${kick(s,"Choisis la bonne réponse")}${prompt}
   <div class="opts ${one?"one":""}">${opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false">${one?esc(o.label):esc(o.label)}</button>`).join("")}</div>
   <div class="lfoot"><button class="b3" id="chk" disabled>Vérifier</button></div></section>`;
  bindQuit();
  const chk=document.getElementById("chk");
  app.querySelector(".opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||chk.dataset.done)return;sfx("tap");
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");sel=+b.dataset.i;chk.disabled=false};
  chk.onclick=()=>{if(sel===null||chk.dataset.done)return;chk.dataset.done=1;
    const ok=opts[sel].m===correct;const btns=app.querySelectorAll(".opt");
    btns.forEach((x,i)=>{if(opts[i].m===correct)x.classList.add("ok")});if(!ok){btns[sel].classList.add("ko","shake")}
    const gain=record(s,ok?2:0);
    const wrong=!ok?`<p class="small">Tu as choisi <b>${esc(opts[sel].m)}</b> : ${esc(EXPL[opts[sel].m]||byM[opts[sel].m].d)}</p>`:"";
    showSheet(ok,feedback(s.w,ok,(ok?`<p class="t">+${gain} XP${combo>=3?` · série de ${combo} !`:""}</p>`:"")+wrong),advance)};
}
function sQcm(s){
  const w=s.w,opts=shuffle([w.m,...distractors(w)]).map(m=>({m,label:m}));
  choose(s,opts,w.m,`<p class="prompt">Quel mot correspond ? ${spkDef(w.d)}</p><div class="speech"><div>${mascot("happy",96)}</div><div class="say def">${rich(w.d,w)}</div></div>`,false);
}
function sQcmInv(s){
  const w=s.w,opts=shuffle([w.m,...distractors(w,2)]).map(m=>({m,label:byM[m].d}));

function sWrite(s){
  const w=s.w,ex=!!run.exam;let hint=0;
  app.innerHTML=`<section class="lesson">${lhead()}${kick(s,ex?"Examen blanc · écris le mot":"Écris le mot")}
   <div class="speech"><div>${mascot("happy",96)}</div><div class="say def">${rich(w.d,w)}</div></div>
   <form id="wf"><input type="text" id="wi" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tape le mot…" aria-label="Ta réponse"></form>
   ${ex?"":`<button class="hintbtn" id="hint">Indice (${w.m.length} lettres)</button><p class="small muted" id="hv"></p>`}
   <div class="lfoot" style="display:flex;flex-direction:column;gap:8px"><button class="b3" id="chk">Vérifier</button>${ex?`<button class="b3 ghost" id="skip">Je ne sais pas</button>`:""}</div></section>`;
  bindQuit();const inp=document.getElementById("wi");
  if(ex){document.getElementById("skip").onclick=()=>{examRecord(s,0,0,{type:"word",txt:""})}}
  else document.getElementById("hint").onclick=()=>{hint=Math.min(hint+1,3);const k=Math.ceil(w.m.length*hint/4);
    document.getElementById("hv").textContent="Ça commence par : "+w.m.slice(0,k)+"…";inp.focus()};
  const check=e=>{if(e)e.preventDefault();const chk=document.getElementById("chk");if(chk.dataset.done||!inp.value.trim())return;chk.dataset.done=1;
    const a=norm(inp.value),b=norm(w.m),d=lev(a,b);
    const exact=a===b,typo=!exact&&d===1&&b.length>=6;
    const ok=exact||typo;const q=ok?(hint?1:2):0;
    if(ex){closeKeyboard();return examRecord(s,q,ok?1:0,{type:"word",txt:inp.value})}
    const gain=record(s,q);if(q===2){S.writeOk++;bump("write");checkRewards(gradeOf(masteredCount()))}
    if(q===1){run.hits[w.m]=(run.hits[w.m]||0)+1}
    const msg=typo?`<p class="t">Presque parfait, attention à l'orthographe : <b>${esc(w.m)}</b></p>`:ok?`<p class="t">${esc(w.m)} · +${gain} XP${hint?" (avec indice)":""}</p>`:`<p class="small">Tu as écrit : <b>${esc(inp.value)}</b></p>`;
    showSheet(ok,feedback(w,ok,msg),advance)};
  document.getElementById("wf").onsubmit=check;document.getElementById("chk").onclick=check;
}

function sPairs(s){
  const ws=s.ws;let sel=null,found=0,err=0;
  const short=d=>d.length>95?d.slice(0,90).replace(/\s\S*$/,"")+"…":d;
  const L=shuffle(ws),R=shuffle(ws);
  app.innerHTML=`<section class="lesson">${lhead()}<span class="kicker">Associe les paires</span><p class="prompt">Touche un mot puis sa définition</p>
   <div class="pairs"><div class="col">${L.map(w=>`<button class="pc w" data-m="${esc(w.m)}">${esc(w.m)}</button>`).join("")}</div>
   <div class="col">${R.map(w=>`<button class="pc" data-d="${esc(w.m)}">${esc(short(w.d))}</button>`).join("")}</div></div></section>`;
  bindQuit();
  app.querySelector(".pairs").onclick=e=>{const b=e.target.closest(".pc");if(!b||b.classList.contains("done"))return;
    if(b.dataset.m){app.querySelectorAll(".pc.w").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sfx("tap");say(b.dataset.m);sel=b.dataset.m;return}
    if(!sel)return;
    if(b.dataset.d===sel){sfx("ok");app.querySelectorAll(`[data-m="${CSS.escape(sel)}"],[data-d="${CSS.escape(sel)}"]`).forEach(x=>{x.classList.remove("sel");x.classList.add("done","pop")});
      found++;sel=null;S.xp+=4;run.xp+=4;bump("xp",4);
      if(found===ws.length){if(!err)S.perfectPairs++;save();setTimeout(()=>showSheet(true,`<p class="t">${err?`${err} erreur${err>1?"s":""}, bien rattrapé !`:"Toutes les paires du premier coup !"} · +${4*ws.length} XP</p>`,advance),250)}}
    else{err++;run.mist++;sfx("ko");b.classList.add("bad","shake");setTimeout(()=>b.classList.remove("bad","shake"),450)}};
}
function finishRun(){
  stopTimers();hideSheet();
  if(run.exam){const r=run;run=null;return examEnd(r)}
  const r=run;run=null;const acc=r.n?Math.round(r.ok/r.n*100):100;const secs=Math.round((Date.now()-r.t0)/1000);
  const perfect=r.mist===0&&r.n>0;
  if(r.node){const first=!S.done[r.node.id];S.done[r.node.id]=(S.done[r.node.id]||0)+1;bump("lessons");
    if(first){S.gems+=r.node.type==="review"?20:5}
    if(perfect){S.perfects++;bump("perfect");S.gems+=5}}
  if(r.kind==="review")bump("review");
  save();checkRewards(gradeOf(masteredCount()));
  sfx("done");confetti();
  const today=S.days[TODAY()]||0,firstToday=S.streakShown!==TODAY();S.streakShown=TODAY();save();
  const st=streak(),due=W.filter(w=>seen(w)&&card(w).due<=TODAY()).length,ni=nextNodeIndex();
  const title=perfect?"Leçon parfaite !":acc>=80?"Leçon terminée !":"Bien joué, tu progresses !";
  const push=today<GOAL?`Plus que <b>${GOAL-today} réponses</b> pour ton objectif du jour. Une autre leçon ?`
    :today<GOAL2?`Objectif rempli ! Encore <b>${GOAL2-today}</b> pour le super objectif (+15 gemmes).`:"Super objectif rempli ! Tu es une machine.";
  app.innerHTML=`<section class="endscreen">${mascot("wow",130)}<h1>${title}</h1>
   <p class="muted">${perfect?"Zéro faute. Chouquette est fière de toi.":r.mist?"Les mots ratés reviendront bientôt : c'est comme ça qu'on les retient.":"Continue comme ça !"}</p>
   <div class="kpis">
    <div class="kpi" style="--c:var(--yellow-d)"><small>Total XP</small><b>${r.xp}</b></div>
    <div class="kpi" style="--c:var(--green)"><small>${acc>=90?"Génial":"Précision"}</small><b>${acc} %</b></div>
    <div class="kpi" style="--c:var(--blue)"><small>Temps</small><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</b></div>
   </div>
   <div class="streakbox"><span class="f">${IC.fire.replace('<svg','<svg width="46" height="46"')}</span><span><b>${st} jour${st>1?"s":""} d'affilée</b><br><span class="small muted">${firstToday?"Série prolongée ! Reviens demain pour la garder.":"Ta série est assurée pour aujourd'hui."}</span></span></div>
   <p><b>${masteredCount()} / ${N}</b> mots maîtrisés · ${push}</p>
   ${ni>=0?`<button class="b3" id="nextL">Leçon suivante</button>`:""}
   ${due?`<button class="b3 orange" id="revL">Réviser ${due} mot${due>1?"s":""}</button>`:""}
   <button class="b3 ghost" id="go">Plus tard</button></section>`;
  if(firstToday)setTimeout(()=>say(`Bravo ! ${st} jour${st>1?"s":""} d'affilée !`),600);else setTimeout(()=>say(pick(["Bravo !","Super travail !","Bien joué !"])),600);
  document.getElementById("go").onclick=()=>{window._scrolled=0;render()};
  const nl=document.getElementById("nextL");if(nl)nl.onclick=()=>startNode(NODES[ni]);
  const rl=document.getElementById("revL");if(rl)rl.onclick=()=>startReview();
}

  const list=ws.length?ws:circular(10);startRun(list.map(w=>({t:"auto",w,rev:true})),{kind:"review"})}

function rTrain(){
  const due=W.filter(w=>seen(w)&&card(w).due<=TODAY()).length;
  const weak=W.filter(w=>seen(w)&&B(w)<=2).length, nseen=W.filter(seen).length;
  const tile=(id,c,ic,t,s)=>`<button class="tile" data-t="${id}"><span class="ic" style="background:var(${c})">${ic}</span><span><b>${t}</b><span>${s}</span></span><span aria-hidden="true" class="muted">›</span></button>`;
  app.innerHTML=topbar()+`
   <div class="speech" style="margin-bottom:16px"><div>${mascot(due?"happy":"wow",90)}</div><div class="say">${due?`<b>${due} mot${due>1?"s":""}</b> t'attendent pour leur révision du jour. C'est le plus important pour ne rien oublier !`:nseen?"Tout est révisé pour aujourd'hui ! Un petit Chrono pour le plaisir ?":"Commence par la première leçon dans Apprendre, puis reviens ici."}</div></div>
   <div class="tiles">
    ${tile("review","--orange",IC.bolt,"Révision du jour",due?`${due} mot${due>1?"s":""} à revoir, tous les anciens mots compris`:"Rien à revoir aujourd'hui")}
    ${tile("weak","--red",IC.target,"Mots fragiles",weak?`${weak} mot${weak>1?"s":""} encore difficiles`:"Aucun mot fragile, bravo")}
    ${tile("exam","--red",IC.trophy,"Examen blanc","20 mots, les 2 sens, note sur 20"+((S.exams||[]).length?" · meilleure : "+String(Math.max(...S.exams.map(e=>e.s))).replace(".",","):""))}
    ${tile("examfull","--purple",IC.crown,"Examen blanc complet","20 mots tirés parmi les 110, comme le jour J")}
    ${tile("def","--blue",IC.pen,"Donne la définition","Le mot s'affiche, tu écris ou dictes la définition")}
    ${tile("flash","--pink",IC.cards,"Cartes mémoire","Retrouve la réponse dans ta tête, à voix haute")}
    ${tile("chrono","--purple",IC.clock,"Chrono 60 s","Record : "+S.best.chrono)}
    ${tile("write","--blue",IC.pen,"Dictée inversée","La définition, tu écris le mot")}
    ${tile("pairs","--green",IC.target,"Paires","3 séries de 5 mots, maîtrisés compris")}
   </div>`;
  bindTop();
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{sfx("tap");const t=b.dataset.t;
    const pool=W.filter(seen);if(!pool.length){toast("Pas encore de mots vus","Fais d'abord une leçon dans Apprendre.","var(--blue)",IC.star);return}
    if(t==="review")startReview();
    if(t==="weak"){const ws=shuffle(W.filter(w=>seen(w)&&B(w)<=2)).slice(0,12);startRun((ws.length?ws:circular(10)).map(w=>({t:"auto",w})))}
    if(t==="exam")return startExam(false);
    if(t==="examfull")return startExam(true);
    if(t==="def")startRun(circular(8).map(w=>({t:"defWrite",w})));
    if(t==="flash")startRun(circular(12).map(w=>({t:"flash",w})));
    if(t==="write")startRun(circular(10).map(w=>({t:"write",w})));
    if(t==="pairs"){const ws=circular(15);startRun([0,1,2].map(i=>({t:"pairs",ws:ws.slice(i*5,i*5+5)})).filter(s=>s.ws.length>=3))}
    if(t==="chrono")startChrono();});
}
function circular(n){const s=W.filter(seen);const base=s.length>=6?s:W;const weak=shuffle(base.filter(w=>!isMastered(w))),strong=shuffle(base.filter(isMastered));
  const out=[];while(out.length<n&&(weak.length||strong.length)){if(weak.length)out.push(weak.shift());if(strong.length&&out.length<n)out.push(strong.shift())}return shuffle(out)}

function startChrono(){
  nav.hidden=true;combo=0;const pool=circular(80);let i=0,score=0,left=60,lock=false,ok=0,n=0;
  const draw=()=>{const w=pool[i%pool.length];const opts=shuffle([w.m,...distractors(w)]);
    app.innerHTML=`<section class="lesson"><div class="lhead"><button class="x" id="q" aria-label="Arrêter">${IC.x}</button><div class="lbar"><i style="width:${left/60*100}%;background:var(--purple)"></i></div><span class="timer">${left}s</span></div>
     <p class="kicker">Score ${score} · record ${S.best.chrono}${combo>=3?` · série ${combo}`:""}</p>
     <div class="speech"><div>${mascot("wow",80)}</div><div class="say def">${rich(w.d,w)}</div></div>
     <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div></section>`;
    document.getElementById("q").onclick=end;
    app.querySelector(".opts").onclick=e=>{const b=e.target.closest(".opt");if(!b||lock)return;lock=true;const good=b.dataset.o===w.m;n++;
      app.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===w.m)x.classList.add("ok")});if(!good)b.classList.add("ko");
      sfx(good?"ok":"ko");answer(w,good?2:0);if(good){ok++;score+=1+Math.floor(combo/5)}
      setTimeout(()=>{lock=false;i++;if(left>0)draw()},good?300:1000)}};
  const end=()=>{stopTimers();const rec=score>S.best.chrono;if(rec)S.best.chrono=score;bump("chrono",score,true);save();checkRewards(gradeOf(masteredCount()));
    sfx("done");if(rec&&score)confetti();
    app.innerHTML=`<section class="endscreen">${mascot(score?"wow":"happy",140)}<h1>${rec?"Nouveau record !":"Temps écoulé !"}</h1>
     <div class="kpis"><div class="kpi" style="--c:var(--purple)"><small>Score</small><b>${score}</b></div><div class="kpi" style="--c:var(--green)"><small>Justes</small><b>${ok}/${n}</b></div><div class="kpi" style="--c:var(--yellow-d)"><small>Record</small><b>${S.best.chrono}</b></div></div>
     <button class="b3 purple" id="again">Rejouer</button><button class="b3 ghost" id="go">Retour</button></section>`;
    document.getElementById("again").onclick=startChrono;document.getElementById("go").onclick=render};
  draw();timers.push(setInterval(()=>{left--;const t=app.querySelector(".timer");if(t)t.textContent=left+"s";const bar=app.querySelector(".lbar i");if(bar)bar.style.width=left/60*100+"%";if(left<=0)end()},1000));
}

/* ---------- Calendrier des jours joués ---------- */
const totalDays=()=>Object.keys(S.days).filter(d=>S.days[d]>0).length;
let calOff=0;
function calendar(){
  const now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+calOff,1);
  const name=m.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const first=(m.getDay()+6)%7,len=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),t=TODAY();
  let cells="";for(let i=0;i<first;i++)cells+="<span></span>";
  let count=0;
  for(let d=1;d<=len;d++){const dn=dayNum(new Date(m.getFullYear(),m.getMonth(),d,12));const on=(S.days[dn]||0)>0,fr=S.frozen.includes(dn);if(on)count++;
    cells+=`<span class="cd ${on?"on":fr?"fr":""} ${dn===t?"today":""}" title="${on?S.days[dn]+" réponses":""}">${on?IC.fire:fr?IC.ice:d}</span>`}
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><button class="chip" id="calP" aria-label="Mois précédent">‹</button><h2 style="text-transform:capitalize">${name}</h2><button class="chip" id="calN" aria-label="Mois suivant" ${calOff>=0?"disabled":""}>›</button></div>
   <p class="small muted" style="text-align:center">${count} jour${count>1?"s":""} joué${count>1?"s":""} ce mois-ci</p>
   <div class="cal">${["L","M","M","J","V","S","D"].map(x=>`<b>${x}</b>`).join("")}${cells}</div>`;
}
document.addEventListener("click",e=>{if(e.target.id==="calP"){calOff--;rQuests()}if(e.target.id==="calN"&&calOff<0){calOff++;rQuests()}});

/* ---------- Quêtes et boutique ---------- */
function rQuests(){
  const q=Q(),qs=todaysQuests(),st=streak(),today=S.days[TODAY()]||0;
  const chest=done=>`<svg class="chest" viewBox="0 0 44 44"><rect x="4" y="16" width="36" height="24" rx="4" fill="${done?"var(--yellow)":"var(--line)"}"/><path d="M4 18a10 10 0 0 1 10-10h16a10 10 0 0 1 10 10v4H4z" fill="${done?"var(--orange)":"var(--muted)"}" opacity=".9"/><rect x="18" y="20" width="8" height="8" rx="2" fill="#fff"/></svg>`;
  app.innerHTML=topbar()+`
   <section class="panel" style="background:var(--orange);border-color:var(--orange-d);color:#fff">
    <div style="display:flex;align-items:center;gap:14px"><span style="width:56px;height:56px;color:#fff">${IC.fire.replace('<svg','<svg width="56" height="56"')}</span>
    <div><p class="big">${st}</p><p>jour${st>1?"s":""} d'affilée${today?"":" · joue aujourd'hui pour la garder !"}</p></div></div>
    <p class="small">${totalDays()} jour${totalDays()>1?"s":""} de connexion au total · record de série : ${Math.max(S.bestStreak||0,st)} · ${S.freezes?`${S.freezes} gel${S.freezes>1?"s":""} en réserve`:"aucun gel en réserve"}</p>
   </section>
   <section class="panel">${calendar()}</section>
   <section class="panel"><h2>Quêtes du jour</h2>
    ${[{n:`Objectif : ${GOAL} réponses`,goal:GOAL,v:today,id:"goal"},{n:`Super objectif : ${GOAL2} réponses (+15 gemmes)`,goal:GOAL2,v:today,id:"goal2"},...qs.map(x=>({n:x.n,goal:x.goal,v:q[x.k]||0,id:x.id}))].map(x=>{const v=Math.min(x.v,x.goal);const done=v>=x.goal;
      return `<div class="quest"><div><b>${esc(x.n)}</b><div class="qbar"><i style="width:${v/x.goal*100}%"></i><span>${v} / ${x.goal}</span></div></div>${chest(done)}</div>`}).join("")}
    <p class="small muted">Chaque quête rapporte 10 gemmes, et les 3 ensemble ouvrent un coffre de 20 gemmes. Nouvelles quêtes demain.</p>
   </section>
   <section class="panel"><h2>Boutique</h2>
    <div class="shopitem"><span class="tile" style="padding:0;border:0"><span class="ic" style="background:var(--blue)">${IC.ice}</span></span><div><b>Gel de série</b><p class="small muted">Protège ta série si tu oublies un jour (2 max).</p></div>
     <button class="b3 blue smallbtn" id="buyF" ${S.gems<30||S.freezes>=2?"disabled":""}><span class="price" style="color:inherit">${IC.gem}30</span></button></div>
    <div class="shopitem"><span class="tile" style="padding:0;border:0"><span class="ic" style="background:var(--purple)">${IC.bolt}</span></span><div><b>Double XP · 15 min</b><p class="small muted">${boost()?"Actif encore "+Math.ceil((S.boostUntil-Date.now())/60000)+" min !":"Toutes tes réponses rapportent 2 fois plus d'XP."}</p></div>
     <button class="b3 purple smallbtn" id="buyB" ${S.gems<40||boost()?"disabled":""}><span class="price" style="color:inherit">${IC.gem}40</span></button></div>
    <p class="small muted">Gagne des gemmes avec les quêtes, les badges, les leçons parfaites et les trophées d'unité.</p>
   </section>`;
  bindTop();
  document.getElementById("buyF").onclick=()=>{if(S.gems<30||S.freezes>=2)return;S.gems-=30;S.freezes++;save();sfx("quest");toast("Gel de série acheté","Ta série est protégée.","var(--blue)",IC.ice);rQuests()};
  document.getElementById("buyB").onclick=()=>{if(S.gems<40||boost())return;S.gems-=40;S.boostUntil=Date.now()+15*60000;save();sfx("level");toast("Double XP activé !","15 minutes pour tout donner.","var(--purple)",IC.bolt,true);rQuests()};
}

/* ---------- Pièges ---------- */
function rFam(){
  app.innerHTML=topbar()+`<div class="speech" style="margin-bottom:14px"><div>${mascot("happy",86)}</div><div class="say">Ces mots se ressemblent : c'est là qu'on se trompe le jour J. Lis l'astuce, puis touche « Cacher » et récite chaque définition.</div></div>`+
  FAMS.map((f,i)=>`<section class="panel fam" id="f${i}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>${esc(f.t)}</h2><button class="chip" data-hide="${i}" aria-pressed="false">Cacher</button></div><p class="tip">${esc(f.tip)}</p><dl>${f.w.map(m=>`<dt>${esc(m)} ${spk(m).replace('class="spk"','class="spk" style="width:34px;height:30px;display:inline-grid;vertical-align:middle;border-bottom-width:3px"')}</dt><dd>${rich(byM[m].d,null)}${clair(byM[m])}</dd>`).join("")}</dl></section>`).join("");
  bindTop();
  app.onclick=e=>{if(tab!=="fam")return;const b=e.target.closest("[data-hide]");if(b){const s=document.getElementById("f"+b.dataset.hide);b.setAttribute("aria-pressed",s.classList.toggle("hide"));return}
    const dd=e.target.closest(".fam.hide dd");if(dd){dd.style.color="var(--muted)";dd.style.background="none";dd.querySelectorAll("*").forEach(x=>x.style.visibility="visible")}};
}

/* ---------- Profil ---------- */
const WEEKS=[["15–21 oct","Unité 1 · A et B"],["22–28 oct","Unité 2 · C"],["29 oct–4 nov","Unité 3 · D, E, F"],["5–11 nov","Unité 4 · G à M"],["12–18 nov","Unité 5 · N, P, R"],["19–25 nov","Unité 6 · S à Z"],["26 nov–1er déc","Grand final + révisions"]];
function rProfile(){
  const k=masteredCount(),g=gradeOf(k),t=TODAY(),next=GRADES[g+1];
  const starts=[[9,15],[9,22],[9,29],[10,5],[10,12],[10,19],[10,26]];let now=-1;const d=new Date();starts.forEach(([mo,dd],i)=>{if(d>=new Date(2026,mo,dd))now=i});
  const nextLabel=w=>{const c=S.cards[w.m];if(!c||!c.n)return"pas encore vu";const x=c.due-t;return x<=0?"à revoir aujourd'hui":x===1?"revient demain":`revient dans ${x} j`};
  app.innerHTML=topbar()+`
   <section class="panel" style="align-items:center;text-align:center">${mascot(k>=40?"wow":"happy",110)}
    <p class="kicker" style="color:var(--purple-d)">${esc(GRADES[g].n)}</p><p class="big" style="color:var(--green-ink)">${k}<span class="muted" style="font-size:1.3rem"> / ${N}</span></p><p>mots maîtrisés</p>
    <div class="qbar" style="width:100%"><i style="width:${k/N*100}%;background:var(--green)"></i></div>
    <p class="small muted">${next?`Encore ${next.at-k} mot${next.at-k>1?"s":""} pour devenir ${esc(next.n)}.`:"Grade maximum. Continue les révisions pour tout garder."}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%"><button class="b3 orange smallbtn" id="toBilan" style="width:100%">Bilan pour maman</button><button class="b3 blue smallbtn" id="toBackup" style="width:100%">Sauvegarde</button></div>
    ${!S.lastBackup||TODAY()-S.lastBackup>=7?`<p class="small" style="color:var(--orange-d);font-weight:800">${S.lastBackup?"Dernière sauvegarde il y a "+(TODAY()-S.lastBackup)+" jours.":"Pas encore de sauvegarde."} Pense à en faire une !</p>`:""}</section>
   <section class="panel"><h2>Grades</h2><div class="ladder">${GRADES.map((x,i)=>`<div class="rung ${i<g?"on":i===g?"cur":""}"><i>${i+1}</i><span><b>${esc(x.n)}</b><br><small class="muted">${esc(x.d)}</small></span><small>${x.at} mots</small></div>`).join("")}</div></section>
   <section class="panel"><h2>Badges · ${Object.keys(S.badges).filter(id=>BADGES.some(b=>b[0]===id)).length}/${BADGES.length}</h2><div class="badges">${BADGES.map(([id,n,dsc,ic,c])=>`<div class="bd ${S.badges[id]?"on":""}" style="--c:var(${c})"><span class="medal">${S.badges[id]?ic:IC.lock}</span><b>${esc(n)}</b><small>${esc(dsc)}</small></div>`).join("")}</div>
    <p class="small muted">${totalDays()} jours de connexion · série actuelle ${streak()} j · Meilleure série de réponses : ${S.best.combo} · Record Chrono : ${S.best.chrono} · ${S.xp} XP</p></section>
   <section class="panel"><h2>Lettres</h2><div class="letters">${LETTERS.map(l=>{const ws=W.filter(w=>w.l===l),m=ws.filter(isMastered).length;return `<div class="lt ${m===ws.length?"full":""}"><div class="f" style="height:${m/ws.length*100}%"></div><b>${l}</b><small>${m}/${ws.length}</small></div>`}).join("")}</div></section>
   <section class="panel"><h2>Plan jusqu'au 1er décembre</h2>${WEEKS.map((w,i)=>`<div class="week ${i===now?"now":""}"><span class="d">${w[0]}</span><span>${w[1]}${i===now?' <span class="pill p4">cette semaine</span>':""}</span></div>`).join("")}</section>
   <section class="panel"><h2>Pourquoi ça marche</h2><ol>
    <li><b>On se teste au lieu de relire.</b> Chercher la réponse, même en se trompant, fait retenir bien plus.</li>
    <li><b>Les mots reviennent au bon moment.</b> Raté : il revient dans la leçon. Su : demain, puis 3, 7, 14, 21 jours. Même maîtrisé, un mot revient.</li>
    <li><b>De plus en plus dur.</b> D'abord choisir parmi 3 ou 4 réponses, puis retrouver la réponse de tête (cartes mémoire), puis écrire le mot sans aide.</li>
    <li><b>On produit la réponse.</b> Écrire ou dicter la définition avec ses mots-clés, c'est l'entraînement le plus proche du contrôle.</li>
    <li><b>On mélange.</b> Chaque leçon glisse d'anciens mots, et les fausses réponses sont des mots qui se ressemblent.</li>
    <li><b>Un peu chaque jour.</b> 10 à 15 minutes. La série et les quêtes sont là pour ça.</li></ol></section>
   <section class="panel"><h2>Tous les mots</h2><div class="wl">${W.slice().sort((a,b)=>B(a)-B(b)||a.m.localeCompare(b.m)).map(w=>`<div class="wi"><span><b>${esc(w.m)}</b><br><small>${nextLabel(w)}</small></span><span class="pill p${B(w)}">${STATE[B(w)]}</span></div>`).join("")}</div></section>
   <section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Voix (lecture des mots)</b><button class="chip" id="voi" aria-pressed="${S.voice!==false}">${S.voice!==false?"Activée":"Coupée"}</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Sons</b><button class="chip" id="snd" aria-pressed="${S.sound}">${S.sound?"Activés":"Coupés"}</button></div>
    <p class="small muted">La progression est enregistrée sur ce téléphone. <button class="linkbtn" id="rst">Tout remettre à zéro</button></p></section>`;
  bindTop();
  document.getElementById("toBilan").onclick=()=>{tab="bilan";render()};
  document.getElementById("toBackup").onclick=()=>{tab="backup";render()};
  document.getElementById("voi").onclick=()=>{S.voice=S.voice===false;save();rProfile()};
  document.getElementById("snd").onclick=()=>{S.sound=!S.sound;save();rProfile()};
  document.getElementById("rst").onclick=function(){if(this.dataset.c){S=JSON.parse(JSON.stringify(DEF));save();rProfile()}else{this.dataset.c=1;this.textContent="Sûr ? Touche encore pour tout effacer"}};
}

applyFreeze();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
